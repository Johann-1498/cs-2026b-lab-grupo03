# Tarea A – criterios de aceptación Gherkin. Ejecutar desde la raíz del repo:
#   PROMPTFOO_PYTHON=python3 npx promptfoo@0.118.0 eval -c prompts/criterios/promptfooconfig.yaml --no-cache
description: "Tarea A – criterios de aceptación Gherkin (EcoRecicla AQP)"
prompts:
  - id: file://v1.txt
    label: v1
  - id: file://v2.txt
    label: v2
  - id: file://v3.txt
    label: v3
providers:
  - id: file://../proveedor_grabado.py   # respuestas grabadas; reemplazable por un modelo real
    label: asistente-grabado
    config:
      tarea: criterios
defaultTest:
  assert:
    - type: is-json                       # A1: contrato de salida
      value: file://esquema.json
      metric: A1_contrato_json
    - type: javascript                    # A2: éxito y error/borde
      value: file://asserts/exito_y_error.js
      metric: A2_exito_y_error
    - type: javascript                    # A3: los ESCENARIOS no describen implementación
      value: file://asserts/sin_implementacion.js
      metric: A3_sin_implementacion
    - type: javascript                    # A6: historia_id coincide
      value: file://asserts/id_coincide.js
      metric: A6_id_coincide
tests:
  - file://casos.yaml
