</text><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="113.3086" x="369.3784" y="798.29">la regla del distrito</text><rect fill="#E8F5E9" height="33.9688" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="189.2305" x="563.4722" y="770.167"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="169.2305" x="573.4722" y="791.3057">Notifica los puntos al vecino</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="421.3242" x="345.3784" y="831.1201"/><rect fill="#E8F5E9" height="33.9688" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="268.127" x="219.9211" y="1000.7993"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="248.127" x="229.9211" y="1021.938">Consolida los kg del d&#237;a para los reportes</text><ellipse cx="353.9846" cy="1065.7681" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="353.9846" cy="1065.7681" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="50.042" y2="1076.7681"/><rect fill="#E8F5E9" height="33.9688" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="197.3105" x="1032.1448" y="237.9014"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="177.3105" x="1042.1448" y="259.04">Revisa la ruta y sale a campo</text><rect fill="#E8F5E9" height="33.9688" rx="12.5" ry="12.5" style="stroke:#2E7D32;stroke-width:0.5;" width="203.9727" x="1028.8137" y="335.8701"/><text fill="#000000" font-family="Arial" font-size="12" lengthAdjust="spacing" textLength="183.9727" x="1038.8137" y="357.0088">Llega al domicilio de la parada</text><polygon fill="#E8F5E9" points="1043.0874,389.8389,1218.5127,389.8389,1230.5127,401.8389,1218.5127,413.8389,1043.0874,413.8389,1031.0874,401.8389,1043.0874,389